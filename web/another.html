
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="application-name" content="Seva">
<meta name="apple-mobile-web-app-title" content="Seva">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDEBD2">
<title>Seva — Another announcement</title>

<script>
  try{ if(localStorage.getItem("seva.darkMode")==="1")
         document.documentElement.setAttribute("data-theme","dark"); }catch(e){}
</script>

<style>
/* ══════════════════════════════════════════════════════════
   SCREEN 6 — ANOTHER ANNOUNCEMENT   (verdict = "other")

   Something was heard. It belongs to somebody else.

   THREE THINGS THIS SCREEN MUST NOT DO:
     1. no sound and no buzz — only a confirmed match earns
        her attention, or she stops trusting the alert
     2. no number anywhere — it is not her number, and
        showing a stranger's number is just noise
     3. no history entry — history is hers, not the hall's

   It takes itself away after a few seconds and goes back to
   listening, because she should not have to tap to carry on
   waiting.

   DESIGN TOKENS — identical to every other screen.
   ══════════════════════════════════════════════════════════ */
:root{
  --primary:#6C3D95;
  --ink:#16215A;

  --bg:#F8FAFF;
  --surface:#FFFFFF;
  --line:#E6EBF5;

  --text:#1F2937;
  --muted:#43506A;            /* 6.93:1 on the amber card */

  /* amber. The mock's #F59E0B gives a white icon 2.15:1 and
     bars on the card 1.84:1 — both fail. These read as the
     same orange and pass.                                  */
  --amber-head:#FDEBD2;
  --disc-from:#DD6B06;        /* white icon 3.40:1 */
  --disc-to:#C2600A;
  --bar-core:#A85206;
  --bar-mid:#B85A08;
  --bar-edge:#C2600A;         /* 3.62:1 on the card */
  --keep-fill:#FBE3C4;

  --f-sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-telugu:"Noto Sans Telugu","Nirmala UI","Gautami",sans-serif;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
  --r-pill:28px; --r-xl:26px;
  --tap:56px;
}
html[data-theme="dark"]{
  --bg:#10131F; --surface:#191E2E; --line:#2A3146;
  --text:#F2F5FA; --muted:#C2CBDB; --ink:#DCE4F5;
  --amber-head:#33240F; --keep-fill:#3A2A12;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--f-sans); font-size:18px; line-height:1.6;
  display:flex; justify-content:center;
}
.screen{
  position:relative; width:100%; max-width:400px; min-height:100dvh;
  display:flex; flex-direction:column; justify-content:center; gap:var(--s4);
  background:linear-gradient(170deg,#F3F1FF 0%,#F5F6FF 46%,var(--bg) 76%);
  padding:calc(env(safe-area-inset-top) + 18px) 20px
          calc(env(safe-area-inset-bottom) + 20px);
}
html[data-theme="dark"] .screen{
  background:linear-gradient(170deg,#1C1B30 0%,#161A2B 46%,var(--bg) 76%);
}

/* ══════ THE CARD ══════ */
.card{
  border-radius:var(--r-xl);
  background:linear-gradient(180deg,var(--amber-head) 0%,var(--surface) 64%);
  border:1px solid var(--line);
  box-shadow:0 14px 34px rgba(120,70,10,.12);
  padding:var(--s8) var(--s4) var(--s6);
  text-align:center;
  animation:rise .45s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(14px)}
  to  {opacity:1;transform:none}
}

.disc{
  width:76px;height:76px;margin:0 auto var(--s4);
  display:grid;place-items:center;border-radius:50%;
  background:linear-gradient(150deg,var(--disc-from),var(--disc-to));
  color:#fff;
  box-shadow:0 10px 22px rgba(194,96,10,.32);
  animation:pop .45s cubic-bezier(.2,1.5,.4,1) .1s both;
}
@keyframes pop{
  from{opacity:0;transform:scale(.5)}
  to  {opacity:1;transform:scale(1)}
}

h1{
  font-size:26px; line-height:1.24; font-weight:800; letter-spacing:-.5px;
  color:var(--text);                       /* 12.58:1 */
  margin:0 auto;
}
.lines{
  margin-top:var(--s3);
  font-size:20px; line-height:1.42;
  color:var(--muted);                      /* 6.93:1 */
}

/* ══════ THE WAVEFORM ══════
   Same generator as the listening screen, amber here so the
   colour alone says "heard, but not yours". Decoration — it
   is not reading a microphone.                             */
.wavebars{
  display:flex;align-items:center;justify-content:center;gap:3px;
  height:74px;width:100%;margin-top:var(--s6);
}
.wavebars i{
  display:block;width:4px;border-radius:2px;background:currentColor;
  height:calc(var(--h) * 70px);
  animation:bar 1.4s ease-in-out infinite alternate;
  animation-delay:var(--d);
}
@keyframes bar{
  from{transform:scaleY(.26)}
  to  {transform:scaleY(1)}
}

/* ══════ KEEP WAITING ══════
   The amber fill creeping across it IS the countdown. When
   it reaches the far side the screen goes back on its own.  */
.keep{
  position:relative; overflow:hidden; isolation:isolate;
  display:grid; place-items:center;
  width:100%; min-height:var(--tap); margin-top:var(--s6);
  border:1px solid var(--line); border-radius:var(--r-pill);
  background:var(--surface);
  color:var(--ink);                        /* 15.0:1 */
  font-family:inherit; font-size:19px; font-weight:750; cursor:pointer;
  box-shadow:0 6px 16px rgba(120,70,10,.12);
  transition:transform .14s ease;
}
.keep::before{
  content:"";
  position:absolute; inset:0 auto 0 0; width:0;
  z-index:0;
  background:var(--keep-fill);
  animation:fill 6s linear forwards;
  animation-play-state:var(--fillrun,running);
}
.keep span{position:relative;z-index:1}
@keyframes fill{ from{width:0} to{width:100%} }
.keep:active{transform:translateY(2px) scale(.99)}
.keep:focus-visible{outline:3px solid var(--primary);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .wavebars i{transform:scaleY(.8)}
}
@media (max-height:740px){
  .card{padding:var(--s6) var(--s4) var(--s4)}
  .disc{width:62px;height:62px}
  h1{font-size:23px}
  .lines{font-size:18px}
  .wavebars{height:56px;margin-top:var(--s4)}
  .wavebars i{height:calc(var(--h) * 52px)}
  .keep{margin-top:var(--s4)}
}
</style>
</head>

<body>
<main class="screen">

  <section class="card">
    <div class="disc" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z" fill="currentColor" stroke-linejoin="round"/>
        <path d="M16 9.2a4 4 0 010 5.6"/>
        <path d="M18.8 6.6a7.8 7.8 0 010 10.8"/>
      </svg>
    </div>

    <h1>Another Announcement</h1>

    <p class="lines">
      It&rsquo;s not for you.<br>
      Please keep waiting.
    </p>

    <div class="wavebars" id="wavebars" aria-hidden="true"></div>
  </section>

  <button class="keep" id="keep" type="button"><span>Keep Waiting</span></button>

</main>

<script>
/* ══════════════════════════════════════════════════════════
   SCREEN 6 — ANOTHER ANNOUNCEMENT

   Notice what is NOT in this file: no navigator.vibrate, no
   audio, no seva.history write, and no read of token, room,
   platform or train_no. That is on purpose — see the note
   at the top of the stylesheet.
   ══════════════════════════════════════════════════════════ */

/* ---- the waveform, amber ----
   Same fixed formula as the listening screen, so the two
   lines are recognisably the same object in two moods.     */
(function(){
  var wavebars = document.getElementById("wavebars");
  var N = 45;
  for (var i = 0; i < N; i++){
    var env  = Math.pow(Math.sin(Math.PI * i / (N - 1)), 0.8);   // tall in the middle
    var seed = Math.sin(i * 12.9898) * 43758.5453;
    var rnd  = seed - Math.floor(seed);                          // 0 … 1, repeatable
    var h    = Math.max(0.10, env * (0.42 + 0.58 * rnd));
    var bar  = document.createElement("i");
    bar.style.setProperty("--h", h.toFixed(3));
    bar.style.setProperty("--d", (((i * 0.06) + rnd * 0.5) % 1.4).toFixed(2) + "s");
    bar.style.color = env > 0.55 ? "#A85206" : (env > 0.28 ? "#B85A08" : "#C2600A");
    wavebars.appendChild(bar);
  }
})();

/* ---- back to listening ----
   She never has to tap. The button is there for the people
   who want to, and it does the same thing sooner.

   The timer only runs if there IS a session to go back to.
   Opened on its own — no place chosen, nothing being
   watched — the screen simply stays put, because there is
   nowhere to return to.                                    */
var BACK_AFTER_MS = 6000;      /* matches the fill animation */
var went = false;

function hasSession(){
  try{ return !!localStorage.getItem("seva.watch"); }catch(e){ return false; }
}

function backToListening(){
  if (went) return;
  went = true;
  window.location.href = "listening.html";
}

document.getElementById("keep").addEventListener("click", backToListening);

if (hasSession()){
  setTimeout(backToListening, BACK_AFTER_MS);
} else {
  /* no session: stop the fill so the button does not promise
     a countdown that is not running */
  document.getElementById("keep").style.setProperty("--fillrun","paused");
}
</script>
<script src="i18n.js"></script>
</body>
</html>
