<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="application-name" content="Seva">
<meta name="apple-mobile-web-app-title" content="Seva">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F4E6">
<title>Seva — Not Quite Heard</title>

<script>
  try{ if(localStorage.getItem("seva.darkMode")==="1")
         document.documentElement.setAttribute("data-theme","dark"); }catch(e){}
</script>

<style>
/* Missing result screen — uncertain match */
:root{
  --primary:#6C3D95;
  --ink:#16215A;
  --bg:#F8FAFF;
  --surface:#FFFFFF;
  --line:#E6EBF5;
  --text:#1F2937;
  --muted:#5A6B86;
  --warn-head:#F8F4E6;
  --warn-from:#B85A08;
  --warn-to:#A85206;
  --keep-fill:#F5EDD4;
  --f-sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
  --r-pill:28px; --r-xl:26px;
  --tap:56px;
}
html[data-theme="dark"]{
  --bg:#10131F; --surface:#191E2E; --line:#2A3146;
  --text:#F2F5FA; --muted:#A8B4C8; --ink:#DCE4F5;
  --warn-head:#2A2410; --keep-fill:#33270F;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--f-sans); font-size:18px; line-height:1.6;
  display:flex; justify-content:center;
}
.screen{
  width:100%; max-width:400px; min-height:100dvh;
  display:flex; flex-direction:column; justify-content:center; gap:var(--s4);
  padding:calc(env(safe-area-inset-top) + 18px) 20px
          calc(env(safe-area-inset-bottom) + 20px);
}

.card{
  border-radius:var(--r-xl);
  background:linear-gradient(180deg,var(--warn-head) 0%,var(--surface) 64%);
  border:1px solid var(--line);
  box-shadow:0 14px 34px rgba(168,82,6,.12);
  padding:var(--s8) var(--s4) var(--s6);
  text-align:center;
  animation:rise .45s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}

.icon{
  width:76px;height:76px;margin:0 auto var(--s4);
  display:grid;place-items:center;border-radius:50%;
  background:linear-gradient(150deg,var(--warn-from),var(--warn-to));
  color:#fff;
  box-shadow:0 10px 22px rgba(168,82,6,.32);
  animation:pop .45s cubic-bezier(.2,1.5,.4,1) .1s both;
}
@keyframes pop{
  from{opacity:0;transform:scale(.5)}
  to{opacity:1;transform:scale(1)}
}

h1{
  font-size:26px; line-height:1.24; font-weight:800; letter-spacing:-.5px;
  color:var(--text); margin:0 auto;
}
.lines{
  margin-top:var(--s3);
  font-size:20px; line-height:1.42;
  color:var(--muted);
}

.keep{
  position:relative;
  display:grid; place-items:center;
  width:100%; min-height:var(--tap); margin-top:var(--s6);
  border:1px solid var(--line); border-radius:var(--r-pill);
  background:var(--surface);
  color:var(--ink);
  font-family:inherit; font-size:19px; font-weight:750; cursor:pointer;
  box-shadow:0 6px 16px rgba(168,82,6,.12);
  transition:transform .14s ease;
}
.keep span{position:relative;z-index:1}
.keep:active{transform:translateY(2px) scale(.99)}
.keep:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.err{
  margin:0 var(--s2);
  padding:10px 14px;
  border-radius:12px;
  background:rgba(220,38,38,.10);
  color:#b91c1c;
  font-size:14px;line-height:1.35;text-align:center;
}

.done{
  position:relative;
  display:grid; place-items:center;
  width:100%; min-height:var(--tap); margin-top:var(--s3);
  border:0; border-radius:var(--r-pill);
  background:linear-gradient(100deg,#2563EB,#7C3AED);
  color:#fff;
  font-family:inherit; font-size:19px; font-weight:750; cursor:pointer;
  box-shadow:0 10px 24px rgba(42,56,160,.28);
  transition:transform .14s ease;
}
.done:active{transform:translateY(2px) scale(.99)}
.done:focus-visible{outline:3px solid var(--primary);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-height:740px){
  .card{padding:var(--s6) var(--s4) var(--s4)}
  .icon{width:62px;height:62px}
  h1{font-size:23px}
  .lines{font-size:18px}
  .keep{margin-top:var(--s4)}
}
</style>
</head>

<body>
<main class="screen">

  <section class="card">
    <div class="icon" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9.2"/><path d="M12 8v5M12 16.6h.01"/>
      </svg>
    </div>

    <h1>Not Quite Heard</h1>

    <p class="lines">
      Something was said, but it wasn't clear enough.<br>
      Please check the display board.
    </p>
  </section>

  <button class="keep" id="play" type="button"><span>Play Announcement</span></button>
  <p class="err" id="err" role="alert" hidden></p>
  <button class="keep" id="keep" type="button"><span>Keep Listening</span></button>
  <button class="done" id="done" type="button">Done</button>

</main>

<script>
var keepBtn = document.getElementById("keep");
var doneBtn = document.getElementById("done");
var playBtn = document.getElementById("play");
var errEl = document.getElementById("err");
var playLbl = playBtn.querySelector("span");

var result = null;
try{ result = JSON.parse(localStorage.getItem("seva.lastResult") || "null"); }catch(e){}

function plain(t){
  return String(t || "").replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
}
function showErr(msg){
  errEl.textContent = msg;
  errEl.hidden = false;
}
if (result && result.spoken){
  document.querySelector(".lines").textContent = plain(result.spoken);
}

var audio = null, speaking = false, playIdle = null;
function stop(){
  if (audio){ try{ audio.pause(); }catch(e){} audio = null; }
  speaking = false;
  playLbl.textContent = playIdle || "Play Announcement";
}
function playServer(src){
  audio = new Audio(src);
  audio.onended = stop;
  audio.onerror = function(){ stop(); showErr("Audio could not be played."); };
  var started = audio.play();
  if (started && started.catch){
    started.catch(function(e){
      if (e && e.name === "NotAllowedError"){ stop(); return; }
      stop(); showErr("Audio could not be played.");
    });
  }
}
function play(){
  if (speaking){ stop(); return; }
  if (!result || !result.spoken){
    showErr("No announcement audio is available.");
    return;
  }
  if (result.tts_error){
    showErr(result.tts_error);
    return;
  }
  errEl.hidden = true;
  if (playIdle === null) playIdle = playLbl.textContent;
  speaking = true;
  playLbl.textContent = "Stop";
  var src = result.audio_url || (result.audio ? "/alerts/" + result.audio : null);
  if (src){ playServer(src); return; }

  var code = result.lang || result.requested_language || "en-IN";
  if (code.indexOf("-") === -1) code += "-IN";
  fetch("/tts", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({text: result.spoken, language: code})
  }).then(function(r){
    if (r.ok) return r.blob();
    return r.json().catch(function(){ return {}; }).then(function(body){
      var e = new Error(body.error || ("Voice failed (" + r.status + ")"));
      e.sevaLanguageError = (r.status === 400);
      throw e;
    });
  }).then(function(b){
    if (!speaking) return;
    playServer(URL.createObjectURL(b));
  }).catch(function(e){
    if (!speaking) return;
    speaking = false;
    playLbl.textContent = playIdle || "Play Announcement";
    showErr(e && e.message ? e.message : "Audio could not be played.");
  });
}

keepBtn.addEventListener("click", function(){
  stop();
  location.href = "listening.html";
});

doneBtn.addEventListener("click", function(){
  stop();
  location.href = "home.html";
});

playBtn.addEventListener("click", play);
try{
  if (localStorage.getItem("seva.autoPlay") !== "0") setTimeout(play, 500);
}catch(e){}
</script>
<script src="i18n.js"></script>
</body>
</html>
