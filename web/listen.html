
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="application-name" content="Seva">
<meta name="apple-mobile-web-app-title" content="Seva">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F7FF">
<title>Seva — Listen</title>

<script>
  try{ if(localStorage.getItem("seva.darkMode")==="1")
         document.documentElement.setAttribute("data-theme","dark"); }catch(e){}
</script>

<style>
/* ══════════════════════════════════════════════════════════
   SCREEN 3 — choose the place, type the one thing she is
   waiting for, then press Start. Start leaves this page and
   opens listening.html, which is screen 4.

   DESIGN TOKENS — identical to index.html and home.html.
   ══════════════════════════════════════════════════════════ */
:root{
  --primary:#6C3D95;
  --accent:#3B82F6;
  --ink:#16215A;

  --bg:#F8FAFF;
  --surface:#FFFFFF;
  --line:#E6EBF5;

  --text:#1F2937;
  --muted:#5A6B86;

  /* blue = an action you take */
  --cta-from:#2563EB;         /* 5.17:1 with white */
  --cta-to:#7C3AED;           /* 5.70:1 with white */
  /* purple = which mode you are in */
  /* the house gradient. one brand ramp, used for every
     selected pill and every primary button.               */
  --mode-from:#2563EB;        /* 5.17:1 with white */
  --mode-to:#7C3AED;          /* 5.70:1 with white */

  --f-sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-telugu:"Noto Sans Telugu","Nirmala UI","Gautami",sans-serif;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
  --r-pill:28px;
  --tap:56px;
  --navh:68px;
}
html[data-theme="dark"]{
  --bg:#10131F; --surface:#191E2E; --line:#2A3146;
  --text:#F2F5FA; --muted:#A8B4C8; --ink:#DCE4F5;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--f-sans); font-size:18px; line-height:1.6;
  display:flex; justify-content:center;
}
.screen{
  position:relative; width:100%; max-width:400px; min-height:100dvh;
  display:flex; flex-direction:column;
  background:
    linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.72) 38%, var(--bg) 62%),
    linear-gradient(170deg,#E9F0FF 0%,#EFF3FF 40%,var(--bg) 70%);
  padding:calc(env(safe-area-inset-top) + 14px) 20px
          calc(env(safe-area-inset-bottom) + var(--navh) + 16px);
}
html[data-theme="dark"] .screen{
  background:
    linear-gradient(180deg, rgba(16,19,31,0) 0%, rgba(16,19,31,.7) 38%, var(--bg) 62%),
    linear-gradient(170deg,#1B2440 0%,#161B2C 45%,var(--bg) 72%);
}

/* ══════ 1. LISTEN / ASK ══════ */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-bottom:var(--s6)}
.modes a,.modes span{
  min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-pill);
  font-size:18px;font-weight:700;text-decoration:none;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
.modes .on{
  border-color:transparent;
  background:linear-gradient(100deg,var(--mode-from),var(--mode-to));
  color:#fff;box-shadow:0 10px 22px rgba(52,70,185,.30);
}
.spk{
  width:.9em;height:.9em;
  flex:none;
  margin-right:.34em;
  vertical-align:-.04em;
}
.modes a:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* ══════ 2. THE QUESTION ══════ */
h1{font-size:24px;font-weight:750;letter-spacing:-.3px;color:var(--ink);margin-bottom:var(--s3)}

.pills{display:flex;gap:var(--s2);margin-bottom:var(--s4)}
.pill{
  flex:1;min-height:50px;padding:0 var(--s2);
  display:grid;place-items:center;
  border:1px solid var(--line);border-radius:var(--r-pill);
  background:var(--surface);color:var(--text);
  font-family:inherit;font-size:15px;font-weight:650;white-space:nowrap;
  cursor:pointer;transition:transform .14s ease;
}
.pill:active{transform:scale(.96)}
.pill:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.pill[aria-pressed="true"]{
  border-color:transparent;
  background:linear-gradient(100deg,var(--mode-from),var(--mode-to));
  color:#fff;box-shadow:0 6px 16px rgba(52,70,185,.26);
}
.pill.hosp{flex:1.5}

/* ══════ 3. THE TYPE BAR ══════ */
.field{
  position:relative;display:flex;align-items:center;min-height:var(--tap);
  border:1px solid var(--line);border-radius:var(--r-pill);
  background:var(--surface);box-shadow:0 2px 10px rgba(22,33,90,.05);
}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.field.warn{border-color:#B42318;box-shadow:0 0 0 3px rgba(180,35,24,.16);animation:nudge .4s ease}
@keyframes nudge{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}
.helper.warn{color:#B42318;font-weight:650}
.field input{
  flex:1;min-width:0;height:54px;padding:0 var(--s3) 0 var(--s6);
  border:0;background:transparent;color:var(--text);font-family:inherit;font-size:18px;
}
.field input::placeholder{color:var(--muted)}
.field input:focus{outline:none}
.clear{
  flex:none;width:44px;height:44px;margin-right:6px;
  display:none;place-items:center;border:0;border-radius:50%;
  background:transparent;color:var(--muted);cursor:pointer;
}
.clear.show{display:grid}
.clear:focus-visible{outline:3px solid var(--primary);outline-offset:-2px}
.helper{margin:var(--s2) var(--s4) 0;font-size:14px;color:var(--muted);min-height:20px}

/* ══════ 4. THE MIC, RESTING ══════ */
.stage{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s4);padding:var(--s6) 0;
}
.micwrap{
  --t:.72;                     /* the one speed dial for everything in here */
  position:relative;width:190px;height:190px;display:grid;place-items:center;
}
.micwrap::before{
  content:"";position:absolute;width:176px;height:176px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,92,246,.24) 0%,rgba(124,92,246,0) 70%);
  animation:halo calc(16.8s * var(--t)) ease-in-out infinite;
}
@keyframes halo{
  0%,100%{transform:scale(1);opacity:.75}
  50%{transform:scale(1.14);opacity:1}
}

.ring{
  --ro:.42; --rs:1.40;
  position:absolute;width:132px;height:132px;border-radius:50%;
  border:3px solid currentColor;filter:blur(2px);opacity:0;pointer-events:none;
  animation:ripple calc(16.8s * var(--t)) cubic-bezier(.16,.72,.3,1) infinite;
}
.ring.r1{color:rgba(34,211,238,.55)}
.ring.r2{color:rgba(167,139,250,.55);animation-delay:calc(5.6s  * var(--t))}
.ring.r3{color:rgba(244,114,208,.45);animation-delay:calc(11.2s * var(--t))}
@keyframes ripple{
  0%  {transform:scale(1);         opacity:0}
  8%  {                            opacity:var(--ro)}
  78% {transform:scale(var(--rs)); opacity:0}
  100%{transform:scale(var(--rs)); opacity:0}
}

.mic{
  position:relative;width:132px;height:132px;display:grid;place-items:center;
  border:0;border-radius:50%;overflow:hidden;isolation:isolate;
  background:linear-gradient(150deg,#6B5BF5 0%,#3A22B8 100%);
  color:#fff;cursor:pointer;
  box-shadow:0 0 0 9px rgba(165,243,252,.30),
             0 0 30px 6px rgba(103,232,249,.34),
             0 18px 38px rgba(58,34,184,.42),
             inset 0 2px 8px rgba(255,255,255,.30),
             inset 0 -16px 30px rgba(20,10,80,.40);
  transition:transform .16s ease;
}
.mic:active{transform:scale(.96)}
.mic:focus-visible{outline:3px solid var(--primary);outline-offset:6px}

.orb{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:1;pointer-events:none}
.swirls{position:absolute;inset:-28%;filter:blur(18px);
        animation:orbSpin calc(72s * var(--t)) linear infinite}
.sw{position:absolute;width:74%;height:74%;border-radius:50%;mix-blend-mode:screen}
.sw.c{top:4%;left:2%;background:radial-gradient(circle,rgba(34,211,238,.95) 0%,rgba(34,211,238,0) 68%);
      animation:drift1 calc(24s * var(--t)) ease-in-out infinite}
.sw.m{bottom:0;left:16%;background:radial-gradient(circle,rgba(244,114,208,.95) 0%,rgba(244,114,208,0) 68%);
      animation:drift2 calc(36s * var(--t)) ease-in-out infinite}
.sw.v{top:12%;right:0;background:radial-gradient(circle,rgba(167,139,250,.95) 0%,rgba(167,139,250,0) 68%);
      animation:drift3 calc(48s * var(--t)) ease-in-out infinite}
.sw.w{bottom:8%;right:8%;width:56%;height:56%;
      background:radial-gradient(circle,rgba(226,255,247,.90) 0%,rgba(226,255,247,0) 66%);
      animation:drift4 calc(72s * var(--t)) ease-in-out infinite}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}
                  33%{transform:translate(22%,16%) scale(1.18)}
                  66%{transform:translate(-14%,10%) scale(.92)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.05)}
                  40%{transform:translate(18%,-20%) scale(.88)}
                  70%{transform:translate(-20%,-8%) scale(1.20)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(.95)}
                  50%{transform:translate(-24%,22%) scale(1.22)}}
@keyframes drift4{0%,100%{transform:translate(0,0) scale(1)}
                  45%{transform:translate(-18%,-18%) scale(1.30)}}

.gloss{
  position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;
  background:
    radial-gradient(130% 90% at 28% 16%,
      rgba(255,255,255,.58) 0%, rgba(255,255,255,.12) 34%, rgba(255,255,255,0) 58%),
    radial-gradient(circle at 50% 54%,
      rgba(28,14,92,.68) 0%, rgba(28,14,92,.30) 36%, rgba(28,14,92,0) 64%);
}
.mic .glyph{position:relative;z-index:3;filter:drop-shadow(0 2px 6px rgba(16,8,70,.5))}

.status{text-align:center}
.status .big{font-size:30px;font-weight:750;letter-spacing:-.4px;color:var(--ink);line-height:1.22}
.status .small{margin-top:var(--s1);font-size:18px;color:var(--muted);
               max-width:21ch;margin-left:auto;margin-right:auto}

/* ══════ 5. START ══════ */
.action{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:var(--tap);margin-top:var(--s3);
  border:0;border-radius:var(--r-pill);
  background:linear-gradient(100deg,var(--cta-from),var(--cta-to));
  color:#fff;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;
  box-shadow:0 10px 24px rgba(42,56,160,.28);
  transition:transform .14s ease, box-shadow .14s ease;
}
.action:active{transform:translateY(2px) scale(.99)}
.action:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.action .lbl,.action svg{position:relative;z-index:2}
.action::after{
  content:"";position:absolute;top:-20%;bottom:-20%;left:-65%;width:46%;
  z-index:1;pointer-events:none;transform:skewX(-18deg);
  background:linear-gradient(100deg,
    rgba(255,255,255,0) 0%, rgba(255,255,255,.10) 30%,
    rgba(255,255,255,.72) 50%, rgba(255,255,255,.10) 70%,
    rgba(255,255,255,0) 100%);
  animation:sheen 6s cubic-bezier(.42,.02,.28,1) infinite;
}
@keyframes sheen{ 0%{left:-65%} 58%,100%{left:135%} }

/* ══════ 6. BOTTOM NAV ══════ */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:400px;display:grid;grid-template-columns:repeat(2,1fr);
  border-top:1px solid var(--line);
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding-bottom:env(safe-area-inset-bottom);z-index:20;
}
.nav a{
  min-height:var(--navh);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;text-decoration:none;color:var(--muted);
  font-size:13px;font-weight:600;
}
.nav a:focus-visible{outline:3px solid var(--primary);outline-offset:-4px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-height:740px){
  .micwrap{width:158px;height:158px}
  .micwrap::before{width:148px;height:148px}
  .ring{width:110px;height:110px}
  .mic{width:110px;height:110px}
  .mic .glyph{width:48px;height:48px}
  .status .big{font-size:26px}
  .stage{padding:var(--s3) 0;gap:var(--s3)}
}
</style>
</head>

<body>
<main class="screen">

  <nav class="modes" aria-label="Mode">
    <span class="on" aria-current="page">Listen</span>
    <a href="ask.html"><svg class="spk" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.2 12C15.7 15.58 15.58 15.7 12 23.2C8.3 15.58 8.42 15.7 0.8 12C8.3 8.42 8.42 8.3 12 0.8C15.7 8.42 15.58 8.3 23.2 12Z"/></svg>Nova</a>
  </nav>

  <h1>What am I waiting for?</h1>

  <div class="pills" id="pills" role="group" aria-label="Place">
    <button class="pill hosp" type="button" data-mode="hospital" aria-pressed="true">Hospital Token</button>
    <button class="pill"      type="button" data-mode="train"    aria-pressed="false">Train</button>
    <button class="pill"      type="button" data-mode="bus"      aria-pressed="false">Bus</button>
  </div>

  <div class="field">
    <label for="watch" hidden>What to watch for</label>
    <input id="watch" type="text" autocomplete="off" autocapitalize="characters"
           spellcheck="false" placeholder="Token number (e.g. A-47)">
    <button class="clear" id="clear" type="button" aria-label="Clear">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
  <p class="helper" id="helper">Type the token you are waiting for.</p>

  <div class="stage">
    <div class="micwrap">
      <span class="ring r1" aria-hidden="true"></span>
      <span class="ring r2" aria-hidden="true"></span>
      <span class="ring r3" aria-hidden="true"></span>

      <button class="mic" id="mic" type="button" aria-label="Start listening">
        <span class="orb" aria-hidden="true">
          <span class="swirls">
            <span class="sw c"></span><span class="sw m"></span>
            <span class="sw v"></span><span class="sw w"></span>
          </span>
        </span>
        <span class="gloss" aria-hidden="true"></span>
        <svg class="glyph" width="56" height="56" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="9" y="2" width="6" height="11.5" rx="3"/>
          <path d="M5.6 10.5a.9.9 0 011.8 0 4.6 4.6 0 009.2 0 .9.9 0 011.8 0 6.4 6.4 0 01-5.5 6.34V20h2.6a.9.9 0 010 1.8H8.5a.9.9 0 010-1.8h2.6v-3.16a6.4 6.4 0 01-5.5-6.34z"/>
        </svg>
      </button>
    </div>

    <div class="status">
      <div class="big">Ready to listen</div>
      <div class="small">Nothing is sent anywhere until you press Start.</div>
    </div>
  </div>

  <button class="action" id="action" type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <rect x="9" y="2" width="6" height="11.5" rx="3"/>
      <path d="M5.6 10.5a.9.9 0 011.8 0 4.6 4.6 0 009.2 0 .9.9 0 011.8 0 6.4 6.4 0 01-5.5 6.34V20h2.6a.9.9 0 010 1.8H8.5a.9.9 0 010-1.8h2.6v-3.16a6.4 6.4 0 01-5.5-6.34z"/>
    </svg>
    <span class="lbl">Start listening</span>
  </button>

</main>

<nav class="nav" aria-label="Main">
  <a href="home.html">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-6h4v6"/>
    </svg>
    Home
  </a>
  <a href="settings.html">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4L5.3 5.3"/>
    </svg>
    Settings
  </a>
</nav>

<script>
/* ══════════════════════════════════════════════════════════
   SCREEN 3 — pick the place, type the one thing, press Start.
   Start saves the choice and opens listening.html (screen 4).
   ══════════════════════════════════════════════════════════ */

var MODES = {
  hospital:{ placeholder:"Token number (e.g. A-47)",
             helper:"Type the token you are waiting for.",
             inputmode:"text",    caps:"characters",
             empty:"Type your token number first." },
  train:   { placeholder:"Train number (e.g. 12739)",
             helper:"Five digits, printed on your ticket.",
             inputmode:"numeric", caps:"off",
             empty:"Type your train number first." },
  bus:     { placeholder:"Route or destination (e.g. Guntur)",
             helper:"Where the bus is going.",
             inputmode:"text",    caps:"words",
             empty:"Type where the bus is going first." }
};

var pills    = document.getElementById("pills");
var field    = document.querySelector(".field");
var input    = document.getElementById("watch");
var clearBtn = document.getElementById("clear");
var helper   = document.getElementById("helper");
var mic      = document.getElementById("mic");
var action   = document.getElementById("action");

var mode = "hospital";

/* ---- the place pills ---- */
function setMode(next){
  mode = next;
  var cfg = MODES[mode];
  var all = pills.querySelectorAll(".pill");
  for (var i = 0; i < all.length; i++){
    all[i].setAttribute("aria-pressed", all[i].dataset.mode === mode ? "true" : "false");
  }
  input.placeholder = cfg.placeholder;
  input.setAttribute("inputmode", cfg.inputmode);
  input.setAttribute("autocapitalize", cfg.caps);
  helper.textContent = cfg.helper;
  input.value = "";
  onInput();
}
pills.addEventListener("click", function(e){
  var b = e.target.closest(".pill");
  if (b) setMode(b.dataset.mode);
});

/* Home sends us here with ?mode=hospital | train | bus */
(function(){
  var m = new URLSearchParams(location.search).get("mode");
  if (m && MODES[m]) setMode(m);
})();

/* ---- the type bar ---- */
function onInput(){
  var has = input.value.trim().length > 0;
  clearBtn.classList.toggle("show", has);
  if (has){                               /* typing clears any warning */
    field.classList.remove("warn");
    helper.classList.remove("warn");
    helper.textContent = MODES[mode].helper;
  }
}
input.addEventListener("input", onInput);
clearBtn.addEventListener("click", function(){
  input.value = ""; onInput(); input.focus();
});
onInput();

/* ---- Start: save, then hand over to screen 4 ---- */
function start(){
  /* empty? do not sit there dead — say what is missing */
  if (input.value.trim().length === 0){
    field.classList.add("warn");
    helper.classList.add("warn");
    helper.textContent = MODES[mode].empty;
    input.focus();
    setTimeout(function(){ field.classList.remove("warn"); }, 420);
    return;
  }
  try{
    localStorage.setItem("seva.watch",
      JSON.stringify({ mode:mode, value:input.value.trim(), at:Date.now() }));
  }catch(e){}
  window.location.href = "listening.html";
}
action.addEventListener("click", start);
mic.addEventListener("click", start);

/* Enter on the keyboard starts too */
input.addEventListener("keydown", function(e){ if (e.key === "Enter") start(); });
</script>
<script src="i18n.js"></script>
</body>
</html>
