
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

  try{ if(localStorage.getItem("seva.darkMode")==="1")
         document.documentElement.setAttribute("data-theme","dark"); }catch(e){}

<style>
/* ══════════════════════════════════════════════════════════
   SCREEN 2 — HOME   (rebuilt to the 22 Oct mockup)

   WHAT CHANGED FROM THE MOCKUP, AND WHY

   1. "View All" is gone. There are exactly four Quick Access
      items and all four are on the screen. A link that opens
      the same four things is a dead control.

   2. The sun is drawn, not typed. An emoji is a font lookup;
      on a phone missing that font it comes out as a box. It
      also changes with the hour — sunrise, sun, moon.

   3. The mascot is our own mark, not a new character. Same
      artwork as the Nova screen, so the app has one face.

   4. Colours checked against the mockup's own backgrounds:
        train icon  #007B5E on its mint disc   3.09  FAIL
        hospital icon on its blue disc         1.27  FAIL
      Icons now carry their own audited ink — the softest is
      Bus at 4.24 on its disc, the rest are 5.0 or better.

   5. No phone status bar. 9:41 and the battery belong to the
      phone, not to us.

   DESIGN TOKENS — shared with every other screen.
   ══════════════════════════════════════════════════════════ */
:root{
  --primary:#6C3D95;
  --ink:#16215A;

  --bg:#ECEFFC;
  --surface:#FFFFFF;
  --line:#E3E8F7;

  --text:#1F2937;
  --muted:#50607D;            /* 5.53 on page · 6.34 on white */
  --muted-tint:#43506A;       /* 7.0+ on every tile tint      */

  --cta-from:#2563EB;
  --cta-to:#7C3AED;

  --hosp-bg:#E9EFFC;  --hosp-disc:#D4E2FD;  --hosp-ink:#1D4ED8;
  --train-bg:#E6FAF1; --train-disc:#C9EEDF; --train-ink:#0A6E42;
  --bus-bg:#FEF2E6;   --bus-disc:#FBDFC2;   --bus-ink:#A85206;
  --hist-bg:#F1ECFC;  --hist-disc:#E3D7FA;  --hist-ink:#5B21B6;

  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-telugu:"Noto Sans Telugu","Nirmala UI","Gautami",sans-serif;

  --tap:56px;
  --navh:68px;
  --r-pill:999px;
}
[data-theme="dark"]{
  --bg:#10131F; --surface:#191E2E; --line:#2A3146;
  --text:#F2F5FA; --muted:#A8B4C8; --muted-tint:#A8B4C8; --ink:#DCE4F5;

  --hosp-bg:#1A2440;  --hosp-disc:#23335C;  --hosp-ink:#9CC0FF;
  --train-bg:#13302A; --train-disc:#1B4539; --train-ink:#7FE0B6;
  --bus-bg:#33240F;   --bus-disc:#4A3317;   --bus-ink:#F6B872;
  --hist-bg:#241C3F;  --hist-disc:#342859;  --hist-ink:#C4A7FF;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f);
  font-size:18px; line-height:1.6;
  background:var(--bg); color:var(--text);
  min-height:100vh; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}

/* ── the soft page, drawn once, no movement ── */
.sky{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.sky::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(52% 26% at 8% 1%,   rgba(206,216,253,.80) 0%, rgba(206,216,253,0) 64%),
    radial-gradient(64% 34% at 102% 10%,rgba(196,206,252,.90) 0%, rgba(196,206,252,0) 62%),
    radial-gradient(58% 24% at 50% 46%, rgba(255,255,255,.60) 0%, rgba(255,255,255,0) 72%),
    radial-gradient(66% 30% at 90% 98%, rgba(202,214,253,.80) 0%, rgba(202,214,253,0) 66%);
}
.swoosh{
  position:absolute;right:-34%;top:-6%;width:104%;height:46%;
  border-radius:50%;
  background:linear-gradient(200deg,rgba(255,255,255,.80),rgba(226,220,252,.34) 58%,rgba(255,255,255,0));
  filter:blur(1px);
}
[data-theme="dark"] .sky::before{
  background:radial-gradient(64% 34% at 102% 10%,rgba(60,54,124,.55) 0%,rgba(60,54,124,0) 62%);
}
[data-theme="dark"] .swoosh{opacity:.10}

.screen{
  max-width:400px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 16px) 16px
          calc(env(safe-area-inset-bottom) + var(--navh) + 30px);
}

/* ── 1. top bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-size:30px;font-weight:800;letter-spacing:-.8px;color:var(--ink)}
.brand .dot{color:var(--cta-to)}
.langchip{
  display:flex;align-items:center;gap:7px;
  min-height:44px;padding:0 14px;border:0;
  border-radius:var(--r-pill);
  background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:16px;font-weight:600;
  text-decoration:none;
  box-shadow:0 6px 18px rgba(31,41,70,.11);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
[data-theme="dark"] .langchip{box-shadow:none;border:1px solid var(--line)}
.langchip .globe{color:var(--cta-from)}
[data-theme="dark"] .langchip .globe{color:#9CC0FF}

/* ── 2. greeting ── */
.greet{
  margin:0 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:32px;line-height:1.18;font-weight:800;letter-spacing:-.6px;color:var(--ink);
}
.greet svg{flex:none}
.greet-sub{margin:0 0 20px;font-size:17px;line-height:1.45;color:var(--muted)}

/* ── 3. the big listen card ── */
.hero{
  display:flex;align-items:center;gap:14px;
  padding:18px 16px;margin-bottom:26px;
  border-radius:22px;text-decoration:none;color:#fff;
  background:linear-gradient(112deg,var(--cta-from) 0%,#4A3BE0 48%,var(--cta-to) 100%);
  box-shadow:0 14px 30px rgba(60,52,170,.34);
  position:relative;overflow:hidden;isolation:isolate;
  -webkit-tap-highlight-color:transparent;
}
.hero::before{                       /* the soft curve on the right */
  content:"";position:absolute;right:-26%;bottom:-70%;width:86%;height:230%;
  border-radius:50%;z-index:0;
  background:radial-gradient(closest-side,rgba(255,255,255,.17),rgba(255,255,255,0) 100%);
}
.hero::after{                        /* 6s sheen, with the pause at 58% */
  content:"";position:absolute;top:-20%;bottom:-20%;left:-65%;width:46%;
  z-index:1;transform:skewX(-18deg);pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22) 50%,rgba(255,255,255,0));
  animation:sheen 6s cubic-bezier(.42,.02,.28,1) infinite;
}
@keyframes sheen{0%{left:-65%}58%,100%{left:135%}}
.hero > *{position:relative;z-index:2}
.hero-disc{
  flex:none;width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,.20);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.34);
  display:grid;place-items:center;
}
.hero-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hero-title{font-size:23px;font-weight:800;line-height:1.2;letter-spacing:-.3px}
.hero-sub{font-size:15px;line-height:1.35;color:rgba(255,255,255,.94)}
.hero-go{
  flex:none;width:44px;height:44px;border-radius:50%;
  background:#fff;color:#2B2A6B;display:grid;place-items:center;
}

/* ── 4. quick access ── */
.section-h{margin:0 0 12px;font-size:24px;font-weight:800;letter-spacing:-.4px;color:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.tile{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;flex-direction:column;
  min-height:150px;padding:14px 14px 48px;
  border-radius:20px;text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.tile::before{                       /* the wave in the corner */
  content:"";position:absolute;right:-34%;bottom:-66%;width:108%;height:176%;
  border-radius:50%;z-index:0;
  background:radial-gradient(closest-side,rgba(255,255,255,.62),rgba(255,255,255,0) 100%);
}
[data-theme="dark"] .tile::before{
  background:radial-gradient(closest-side,rgba(255,255,255,.07),rgba(255,255,255,0) 100%);
}
.tile > *{position:relative;z-index:1}
.tile .ic{
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;margin-bottom:10px;
}
.tile .name{font-size:19px;font-weight:800;line-height:1.2;color:var(--ink)}
.tile .hint{font-size:14px;line-height:1.3;color:var(--muted-tint);margin-top:2px}
.tile .go{
  position:absolute;right:12px;bottom:12px;z-index:1;
  width:34px;height:34px;border-radius:50%;
  background:var(--surface);display:grid;place-items:center;
  box-shadow:0 3px 10px rgba(31,41,70,.14);
}
.tile.hosp {background:var(--hosp-bg)}
.tile.hosp  .ic{background:var(--hosp-disc);color:var(--hosp-ink)}
.tile.hosp  .go{color:var(--hosp-ink)}
.tile.train{background:var(--train-bg)}
.tile.train .ic{background:var(--train-disc);color:var(--train-ink)}
.tile.train .go{color:var(--train-ink)}
.tile.bus  {background:var(--bus-bg)}
.tile.bus   .ic{background:var(--bus-disc);color:var(--bus-ink)}
.tile.bus   .go{color:var(--bus-ink)}
.tile.hist {background:var(--hist-bg)}
.tile.hist  .ic{background:var(--hist-disc);color:var(--hist-ink)}
.tile.hist  .go{color:var(--hist-ink)}

/* ── 5. first-time banner ── */
.banner{
  display:flex;align-items:center;gap:12px;
  min-height:var(--tap);padding:12px 14px;
  border-radius:20px;text-decoration:none;
  background:#EAF2FD;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9);
  -webkit-tap-highlight-color:transparent;
}
[data-theme="dark"] .banner{background:#18223A;box-shadow:none;border:1px solid var(--line)}
.banner img{width:48px;height:auto;flex:none;display:block}
.banner .btxt{flex:1;min-width:0;display:flex;flex-direction:column}
.banner .bt{font-size:17px;font-weight:800;color:var(--ink);line-height:1.25}
.banner .bs{font-size:15px;color:var(--muted-tint);line-height:1.3}
.banner .bg{flex:none;color:var(--muted-tint)}

/* ── 6. bottom bar ── */
.nav{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 12px);
  width:min(372px,calc(100% - 28px));
  display:grid;grid-template-columns:repeat(3,1fr);
  border-radius:26px;
  background:rgba(255,255,255,.90);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(31,41,70,.15), inset 0 0 0 1px rgba(255,255,255,.95);
  z-index:30;
}
[data-theme="dark"] .nav{background:rgba(25,30,46,.94);box-shadow:none;border:1px solid var(--line)}
.nav a{
  position:relative;min-height:var(--navh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--muted);font-size:13px;font-weight:600;
  -webkit-tap-highlight-color:transparent;
}
.nav a.on{color:#5B21B6;font-weight:700}
[data-theme="dark"] .nav a.on{color:#C4A7FF}
.nav a.on::after{
  content:"";position:absolute;bottom:11px;width:22px;height:3px;border-radius:2px;
  background:currentColor;
}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
@media (max-width:359px){
  .brand{font-size:26px}
  .greet{font-size:28px}
  .hero-title{font-size:21px}
  .tile{min-height:142px}
  .tile .name{font-size:18px}
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true"><span class="swoosh"></span></div>

<main class="screen">

  <!-- ══════════ 1. TOP BAR ══════════ -->
  <header class="topbar">
    <span class="brand">Seva<span class="dot">.</span></span>

    <a class="langchip" href="select-language.html" aria-label="Change language">
      <svg class="globe" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3C9.5 5.7 9.5 18.3 12 21"/>
      </svg>
      <span id="langName">English</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </a>
  </header>

  <!-- ══════════ 2. GREETING ══════════ -->
  <h1 class="greet"><span id="greetWord">Good Morning</span><span id="greetIcon"></span></h1>
  <p class="greet-sub">Stay confident. We&rsquo;ll listen for you.</p>

  <!-- ══════════ 3. THE BIG LISTEN CARD ══════════ -->
  <a class="hero" href="listen.html">
    <span class="hero-disc" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
        <rect x="2.2"  y="10"   width="2.4" height="4"    rx="1.2"/>
        <rect x="6.1"  y="7"    width="2.4" height="10"   rx="1.2"/>
        <rect x="10"   y="3.4"  width="2.4" height="17.2" rx="1.2"/>
        <rect x="13.9" y="6"    width="2.4" height="12"   rx="1.2"/>
        <rect x="17.8" y="9"    width="2.4" height="6"    rx="1.2"/>
      </svg>
    </span>
    <span class="hero-txt">
      <span class="hero-title">Listen for your</span>
      <span class="hero-sub">Hospital Token, Train or Bus</span>
    </span>
    <span class="hero-go" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13M12 5l7 7-7 7"/>
      </svg>
    </span>
  </a>

  <!-- ══════════ 4. QUICK ACCESS ══════════ -->
  <h2 class="section-h">Quick Access</h2>

  <div class="tiles">

    <a class="tile hosp" href="listen.html?mode=hospital">
      <span class="ic" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M6.5 4.5h11A3.5 3.5 0 0121 8v9.5a3.5 3.5 0 01-3.5 3.5h-11A3.5 3.5 0 013 17.5V8a3.5 3.5 0 013.5-3.5zM10.8 8.75h2.4v2.8H16v2.4h-2.8v2.8h-2.4v-2.8H8v-2.4h2.8z"/>
        </svg>
      </span>
      <span class="name">Hospital</span>
      <span class="hint">( Token number )</span>
      <span class="go" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M12 5l7 7-7 7"/>
        </svg>
      </span>
    </a>

    <a class="tile train" href="listen.html?mode=train">
      <span class="ic" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M9.5 2h5A5.5 5.5 0 0120 7.5v8a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 15.5v-8A5.5 5.5 0 019.5 2zM8.5 6.5a1.2 1.2 0 00-1.2 1.2v2.6a1.2 1.2 0 001.2 1.2h7a1.2 1.2 0 001.2-1.2V7.7a1.2 1.2 0 00-1.2-1.2zm-1.3 8.1a1.3 1.3 0 102.6 0 1.3 1.3 0 10-2.6 0zm7 0a1.3 1.3 0 102.6 0 1.3 1.3 0 10-2.6 0z"/>
          <path d="M9 18.5L6.8 21.8M15 18.5l2.2 3.3" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" fill="none"/>
        </svg>
      </span>
      <span class="name">Train</span>
      <span class="hint">( Platform number )</span>
      <span class="go" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M12 5l7 7-7 7"/>
        </svg>
      </span>
    </a>

    <a class="tile bus" href="listen.html?mode=bus">
      <span class="ic" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M7 2.5h10A3.5 3.5 0 0120.5 6v10.5a2.5 2.5 0 01-1.6 2.33V20.4a1.4 1.4 0 01-2.8 0v-1.4H7.9v1.4a1.4 1.4 0 01-2.8 0v-1.57A2.5 2.5 0 013.5 16.5V6A3.5 3.5 0 017 2.5zM6.6 6.8v4.6a1 1 0 001 1h8.8a1 1 0 001-1V6.8a1 1 0 00-1-1H7.6a1 1 0 00-1 1zm.3 8.3a1.35 1.35 0 102.7 0 1.35 1.35 0 10-2.7 0zm7.8 0a1.35 1.35 0 102.7 0 1.35 1.35 0 10-2.7 0z"/>
        </svg>
      </span>
      <span class="name">Bus</span>
      <span class="hint">( Bay &amp; route )</span>
      <span class="go" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M12 5l7 7-7 7"/>
        </svg>
      </span>
    </a>

    <a class="tile hist" href="history.html">
      <span class="ic" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M12 2.6a9.4 9.4 0 00-8.1 4.64V4.6a1.2 1.2 0 10-2.4 0v5.2a1.2 1.2 0 001.2 1.2h5.2a1.2 1.2 0 100-2.4H5.73A7 7 0 1112 19a1.2 1.2 0 100 2.4A9.4 9.4 0 1012 2.6zm1.15 4.6h-2.3v5.68l4.57 2.71 1.18-1.98-3.45-2.05z"/>
        </svg>
      </span>
      <span class="name">History</span>
      <span class="hint">( Past alerts )</span>
      <span class="go" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M12 5l7 7-7 7"/>
        </svg>
      </span>
    </a>

  </div>

<script>
/* ══════════════════════════════════════════════════════════
   SCREEN 2 — HOME
   ══════════════════════════════════════════════════════════ */

/* ---- greeting follows the clock ----
   The sun is drawn here, not typed. An emoji is a font
   lookup, and a phone without that font shows a box.      */
var SUN =
  '<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">' +
  '<circle cx="12" cy="12" r="5" fill="#F7A600"/>' +
  '<g stroke="#F7A600" stroke-width="2.2" stroke-linecap="round">' +
  '<path d="M12 1.4v2.8M12 19.8v2.8M22.6 12h-2.8M4.2 12H1.4' +
  'M19.5 4.5l-2 2M6.5 17.5l-2 2M19.5 19.5l-2-2M6.5 6.5l-2-2"/></g></svg>';
var MOON =
  '<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">' +
  '<path fill="#5B4BD6" d="M20.5 14.9A9.2 9.2 0 019.1 3.5 9.4 9.4 0 1020.5 14.9z"/></svg>';

var h = new Date().getHours();
var word = "Good Evening", icon = MOON;
if (h < 12)       { word = "Good Morning";   icon = SUN; }
else if (h < 17)  { word = "Good Afternoon"; icon = SUN; }

document.getElementById("greetWord").textContent = word;
document.getElementById("greetIcon").innerHTML   = icon;   /* fixed strings above, no user text */

/* ---- the language chip shows the saved choice ---- */
var LANGS = {
  "te-IN":"తెలుగు", "en-IN":"English", "hi-IN":"हिन्दी", "ta-IN":"தமிழ்",
  "kn-IN":"ಕನ್ನಡ",  "ml-IN":"മലയാളം", "mr-IN":"मराठी",  "pa-IN":"ਪੰਜਾਬੀ",
  "bn-IN":"বাংলা",  "gu-IN":"ગુજરાતી"
};
try{
  var saved = localStorage.getItem("seva.language") || "en-IN";
  if (LANGS[saved]) document.getElementById("langName").textContent = LANGS[saved];
}catch(e){}
</script>
