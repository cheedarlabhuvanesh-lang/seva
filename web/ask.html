<style>
/* ══════════════════════════════════════════════════════════
   SCREEN 8 — NOVA   (rebuilt to the 22 Oct mockup)

   WHAT CHANGED FROM THE MOCKUP, AND WHY

   1. SIX COLOURS WERE REPLACED. Measured against the mockup's
      own background, these all fell under WCAG 4.5:1 —
        subtitle line 2   #6171A1  4.36
        Listen label      #546594  4.27
        Listen mic        #526293  4.44
        placeholder       #8795BC  2.83
        tagline           #646DAE  4.36
        Settings label    #47588E  2.24
      All now use --muted #50607D: 5.63 on the lavender page,
      6.34 on white. Nothing else about them moved.

   2. THE PERSON ICON IS NOW THE LANGUAGE PICKER. Seva has no
      accounts, no login and no profile — a person tile would
      open nothing. Language is the one per-user setting that
      genuinely matters here, so the tile keeps its place and
      does real work.

   3. THE MENU HOLDS ONLY WHAT THE BOTTOM BAR DOES NOT.
      History and About. Home and Settings are in the bar, so
      they are not repeated — no control sits in two places.

   4. NOTHING IN THE BOTTOM BAR IS MARKED ACTIVE. The current
      screen is Nova, and Nova lives in the top switch. The
      mockup lights up Home, which would be untrue here.

   5. THE DISCLAIMER STAYS, under the tagline. One quiet line.

   DESIGN TOKENS — shared with every other screen.
   ══════════════════════════════════════════════════════════ */
:root{
  --primary:#6C3D95;
  --ink:#16215A;

  --bg:#EEF1FC;
  --surface:#FFFFFF;
  --line:#E3E8F7;

  --text:#1F2937;
  --muted:#50607D;            /* 5.63 on page · 6.34 on white */

  --cta-from:#2563EB;         /* white on it 5.17:1 */
  --cta-to:#7C3AED;           /* white on it 5.70:1 */

  --spark:#4C3BD8;

  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-telugu:"Noto Sans Telugu","Nirmala UI","Gautami",sans-serif;

  --tap:56px;
  --navh:68px;
  --r-pill:999px;
}
[data-theme="dark"]{
  --bg:#10131F; --surface:#191E2E; --line:#2A3146;
  --text:#F2F5FA; --muted:#A8B4C8; --ink:#DCE4F5;
  --spark:#A89CFF;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f);
  font-size:18px; line-height:1.6;
  background:var(--bg); color:var(--text);
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ── the aurora page, drawn once, no movement ── */
.sky{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.sky::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(58% 40% at 10% 4%,   rgba(190,180,252,.90) 0%, rgba(190,180,252,0) 62%),
    radial-gradient(52% 34% at 95% 1%,   rgba(212,196,250,.72) 0%, rgba(212,196,250,0) 64%),
    radial-gradient(64% 30% at 50% 44%,  rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 70%),
    radial-gradient(70% 34% at 84% 99%,  rgba(196,212,253,.90) 0%, rgba(196,212,253,0) 66%),
    radial-gradient(58% 28% at 4% 94%,   rgba(222,208,252,.62) 0%, rgba(222,208,252,0) 68%);
}
.wave{position:absolute;left:-28%;width:156%;border-radius:50%;filter:blur(2px);opacity:.55}
.wave.a{bottom:7%;  height:30%; background:radial-gradient(60% 100% at 42% 100%,rgba(255,255,255,.92),rgba(255,255,255,0) 72%)}
.wave.b{bottom:-6%; height:34%; background:radial-gradient(58% 100% at 62% 100%,rgba(205,198,250,.70),rgba(205,198,250,0) 74%)}
.dot{position:absolute;border-radius:50%;background:rgba(150,160,230,.55)}
.dot.d1{width:9px;height:9px;left:86%;top:76%}
.dot.d2{width:6px;height:6px;left:82%;top:78.4%;background:rgba(196,170,240,.65)}
.dot.d3{width:7px;height:7px;left:40%;top:81%;background:rgba(150,180,235,.55)}
[data-theme="dark"] .sky::before{
  background:
    radial-gradient(58% 40% at 10% 4%,  rgba(78,66,150,.55) 0%, rgba(78,66,150,0) 62%),
    radial-gradient(70% 34% at 84% 99%, rgba(44,62,122,.55) 0%, rgba(44,62,122,0) 66%);
}
[data-theme="dark"] .wave,[data-theme="dark"] .dot{opacity:.16}

/* ── top row: menu · switch · language ── */
.top{
  width:100%;max-width:400px;margin:0 auto;flex:none;
  padding:calc(env(safe-area-inset-top) + 14px) 14px 0;
  display:flex;align-items:center;gap:10px;
}
.tile{
  width:48px;height:48px;flex:none;border:0;padding:0;
  border-radius:15px;
  background:rgba(255,255,255,.80);
  box-shadow:0 6px 18px rgba(31,41,70,.11), inset 0 0 0 1px rgba(255,255,255,.95);
  display:grid;place-items:center;color:var(--ink);cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  text-decoration:none;
}
.tile:active{transform:translateY(1px)}
[data-theme="dark"] .tile{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line)}

.modes{
  flex:1;min-width:0;display:flex;gap:4px;padding:5px;
  border-radius:var(--r-pill);
  background:rgba(255,255,255,.66);
  box-shadow:0 6px 18px rgba(31,41,70,.11), inset 0 0 0 1px rgba(255,255,255,.95);
}
[data-theme="dark"] .modes{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--line)}
.modes a,.modes span{
  flex:1;min-width:0;min-height:46px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  border-radius:var(--r-pill);
  font-size:16px;font-weight:700;letter-spacing:.01em;
  text-decoration:none;color:var(--muted);
  -webkit-tap-highlight-color:transparent;
}
.modes .on{
  color:#fff;
  background:linear-gradient(135deg,var(--cta-from),var(--cta-to));
  box-shadow:0 6px 16px rgba(76,58,200,.34);
}
.modes svg{flex:none}

/* the spark, traced from the supplied mark */
.spk{width:.9em;height:.9em;flex:none}

/* ── menu sheet — only what the bottom bar does not hold ── */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer:not([hidden]){display:block}
.scrim{position:absolute;inset:0;background:rgba(14,18,42,.44)}
.sheet{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top) + 72px);
  width:min(372px,calc(100% - 28px));
  background:var(--surface);border-radius:20px;overflow:hidden;
  box-shadow:0 22px 54px rgba(14,18,42,.30);
}
.sheet a{
  display:flex;align-items:center;gap:13px;
  min-height:var(--tap);padding:0 18px;
  color:var(--text);text-decoration:none;font-size:17px;font-weight:600;
}
.sheet a + a{border-top:1px solid var(--line)}
.sheet svg{flex:none;color:var(--muted)}

/* ── body ── */
.screen{
  flex:1;width:100%;max-width:400px;margin:0 auto;
  padding:0 16px calc(env(safe-area-inset-bottom) + var(--navh) + 28px);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.bot{
  width:84px;height:auto;display:block;
  margin:24px auto 16px;
  /* no movement — the mark is the mark */
}
h1{
  margin:0 0 10px;
  font-size:36px;line-height:1.15;font-weight:800;letter-spacing:-.5px;
  color:var(--ink);
}
.sub{
  margin:0 0 26px;max-width:330px;
  font-size:18px;line-height:1.5;color:var(--muted);
}

/* ── the question box ── */
.bar{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:6px 6px 6px 15px;
  background:var(--surface);border-radius:var(--r-pill);
  box-shadow:0 12px 28px rgba(31,41,70,.13), inset 0 0 0 1px rgba(255,255,255,.9);
}
[data-theme="dark"] .bar{box-shadow:none;border:1px solid var(--line)}
.bar:focus-within{
  box-shadow:0 0 0 3px rgba(99,102,241,.40), 0 12px 28px rgba(31,41,70,.13);
}
.spkin{flex:none;display:grid;place-items:center;color:var(--spark)}
#q{
  flex:1;min-width:0;min-height:46px;
  border:0;background:transparent;outline:none;
  font-family:inherit;font-size:17px;color:var(--text);
}
#q::placeholder{color:#5A6B86;opacity:1}          /* 5.41 on white */
[data-theme="dark"] #q::placeholder{color:#9AA7BD}
#q::-webkit-search-cancel-button{display:none}
.send{
  flex:none;width:46px;height:46px;border:0;padding:0;border-radius:50%;
  background:linear-gradient(135deg,var(--cta-from),var(--cta-to));
  color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 6px 16px rgba(76,58,200,.38);
  -webkit-tap-highlight-color:transparent;
}
.send:active{transform:translateY(1px)}

/* ── thinking ── */
.think{
  display:none;width:100%;margin-top:14px;
  padding:16px 18px;border-radius:18px;
  background:var(--surface);
  box-shadow:0 10px 24px rgba(31,41,70,.10), inset 0 0 0 1px rgba(255,255,255,.9);
  align-items:center;gap:12px;text-align:left;
}
[data-theme="dark"] .think{box-shadow:none;border:1px solid var(--line)}
.think.show{display:flex}
.think p{margin:0;flex:1;font-size:16px;line-height:1.45;color:var(--muted)}
.dots{display:flex;gap:5px;flex:none}
.dots i{
  width:7px;height:7px;border-radius:50%;background:var(--spark);
  animation:dot 1.25s ease-in-out infinite;
}
.dots i:nth-child(2){animation-delay:.14s}
.dots i:nth-child(3){animation-delay:.28s}
.dots i:nth-child(4){animation-delay:.42s}
@keyframes dot{0%,70%,100%{opacity:.22;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}

/* ── foot ── */
.foot{margin-top:auto;padding-top:30px}
.tag{
  margin:0 0 7px;
  font-size:12px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
  color:var(--muted);
}
.disclaimer{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}

/* ── bottom bar — two items, neither is the current screen ── */
.nav{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 12px);
  width:min(372px,calc(100% - 28px));
  display:grid;grid-template-columns:repeat(2,1fr);
  border-radius:26px;
  background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(31,41,70,.15), inset 0 0 0 1px rgba(255,255,255,.95);
  z-index:30;
}
[data-theme="dark"] .nav{background:rgba(25,30,46,.92);box-shadow:none;border:1px solid var(--line)}
.nav a{
  min-height:var(--navh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--muted);
  font-size:13px;font-weight:600;
  -webkit-tap-highlight-color:transparent;
}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
@media (max-width:359px){
  .bot{width:70px}
  h1{font-size:31px}
  .sub{font-size:17px}
  .modes a,.modes span{font-size:15px}
}
</style>
</head>

</div>

<header class="top">

    </svg>

</header>

<div class="drawer" id="drawer" hidden>
  <div class="scrim" id="scrim"></div>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M12 2.6A9.4 9.4 0 1 0 21.4 12 9.41 9.41 0 0 0 12 2.6zm.95 4.6v5.05l4.05 2.4-.95 1.6-5-2.95V7.2z"/>

      </svg>
      About Seva
    </a>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   SCREEN 8 — NOVA

   The question goes to the laptop, and the laptop talks to
   the model. The key never comes near this file.
   ══════════════════════════════════════════════════════════ */

var q        = document.getElementById("q");
var send     = document.getElementById("send");
var think    = document.getElementById("think");
var thinkMsg = document.getElementById("thinkMsg");
var menuBtn  = document.getElementById("menuBtn");
var drawer   = document.getElementById("drawer");
var scrim    = document.getElementById("scrim");

/* ---- menu ---- */
function openMenu(){
  drawer.hidden = false;
  menuBtn.setAttribute("aria-expanded","true");
}
function closeMenu(){
  drawer.hidden = true;
  menuBtn.setAttribute("aria-expanded","false");
}
menuBtn.addEventListener("click", function(){
  if (drawer.hidden) openMenu(); else closeMenu();
});
scrim.addEventListener("click", closeMenu);
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && !drawer.hidden) closeMenu();
});

/* ---- the wait ----
   No promised number. The wording moves on by itself if it
   really is taking a while, which is honest and stops her
   wondering whether it has died.                           */
var asking = false;
var timers = [];

function clearTimers(){
  for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
  timers = [];
}

function startThinking(){
  thinkMsg.textContent = "Thinking\u2026 please wait a few seconds";
  think.classList.add("show");
  timers.push(setTimeout(function(){
    thinkMsg.textContent = "Still thinking\u2026 the connection is slow";
  }, 8000));
  timers.push(setTimeout(function(){
    thinkMsg.textContent = "This is taking longer than usual. You can wait, or ask again.";
  }, 20000));
}

function stopThinking(){
  clearTimers();
  think.classList.remove("show");
}

function ask(){
  var text = q.value.trim();
  if (!text || asking) return;
  asking = true;
  q.blur();
  startThinking();

  try{ localStorage.setItem("seva.question", text); localStorage.removeItem("seva.answer"); }catch(e){}

  
  /* Live: asks the database on the server, keeps its answer, then opens the answer screen. */
  var _lg = "en"; try{ _lg = (localStorage.getItem("seva.language") || "en-IN").indexOf("te") === 0 ? "te" : "en"; }catch(e){}
  fetch("/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:text,lang:_lg})})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ try{ if (d && d.found && typeof d.answer === "string") localStorage.setItem("seva.answer", d.answer); }catch(e){} })
    .catch(function(){})
    .then(function(){ window.location.href = "answer.html"; });
}

send.addEventListener("click", ask);
q.addEventListener("keydown", function(e){ if (e.key === "Enter") ask(); });
</script>
