<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seva — Hear what matters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#6C3D95;--pl:#A78BFA;--bg:#F8FAFF;--sf:#fff;--tx:#1F2937;--tx2:#64748B;--ok:#087F5B;--okbg:#E7F8F0;--wn:#9A4A00;--wnbg:#FFF2D9;--er:#B42318;--erbg:#FEECEB;--bd:#D9DEEA}
*{box-sizing:border-box;margin:0}
body{font:19px/1.5 system-ui,"Noto Sans Telugu",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:88px}
.te{font-family:"Noto Sans Telugu",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:440px;margin:0 auto;padding:16px}
h1{font-size:30px;line-height:1.2}h2{font-size:24px;line-height:1.3;margin-bottom:8px}
p.sub{color:var(--tx2);font-size:17px}
.screen{display:none}.screen.on{display:block}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-top:16px}
label{display:block;font-weight:600;margin:12px 0 6px}
input,textarea,select{width:100%;font:inherit;padding:14px;border:2px solid var(--bd);border-radius:12px;min-height:56px;background:#fff;color:var(--tx)}
input:disabled,select:disabled{background:#F1F3F9;color:var(--tx2)}
input[type=file]{padding:12px}
textarea{min-height:88px}
button{font-weight:600;font-size:18px;line-height:1.2;font-family:inherit;min-height:56px;padding:12px 20px;border-radius:14px;border:2px solid var(--p);background:#fff;color:var(--p);cursor:pointer}
button.main{background:var(--p);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--pl);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:14px}.row>button{flex:1}
.chip{display:inline-block;background:#EFE8F7;color:var(--p);border-radius:99px;padding:4px 14px;font-size:16px;font-weight:600}
.state{border-radius:16px;padding:20px;margin-top:16px;text-align:center;border:2px solid}
.state svg{width:44px;height:44px;margin-bottom:6px}
.state h3{font-size:24px;line-height:1.3}
.state p{margin-top:6px}
.s-idle{background:#fff;border-color:var(--bd)}
.s-listen{background:#F3EDFA;border-color:var(--p);color:var(--p)}
.s-ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.s-warn{background:var(--wnbg);border-color:var(--wn);color:var(--wn)}
.s-err{background:var(--erbg);border-color:var(--er);color:var(--er)}
.big{font-size:clamp(56px,18vw,72px);font-weight:700;line-height:1.1;margin:6px 0}
.badge{display:inline-block;font-size:14px;font-weight:700;border:2px dashed currentColor;border-radius:8px;padding:2px 8px;margin-bottom:8px}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@media(prefers-reduced-motion:reduce){.pulse,.spin{animation:none}}
.spin{width:44px;height:44px;border:5px solid #E5DAF3;border-top-color:var(--p);border-radius:50%;margin:0 auto 8px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.state button{margin-top:14px;width:100%}
details{margin-top:16px;border:2px dashed var(--bd);border-radius:16px;padding:14px;background:#fff}
summary{font-weight:700;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:center;gap:8px;padding:8px}
nav button{flex:1;max-width:140px;border:0;color:var(--tx2);font-size:16px}
nav button[aria-current=page]{color:var(--p);background:#EFE8F7}
.hint{font-size:16px;color:var(--tx2);margin-top:8px}
.state .hint{color:inherit}
.meter{height:12px;border-radius:99px;background:#E5DAF3;overflow:hidden;margin:12px auto 4px;max-width:260px}
.meter i{display:block;height:100%;width:0;background:var(--p);transition:width .1s}

/* ===== Seva design: aurora, glass cards, shine, motion ===== */
:root{--primary:#6C3D95;--ink:#16215A;--cta-from:#2563EB;--cta-to:#7C3AED}
body{background:linear-gradient(170deg,#EDE8FC 0%,#E6EEFE 42%,#FBF8FF 78%) fixed;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(46px);will-change:transform}
.b1{width:260px;height:260px;background:#B9A6F7;top:-70px;left:-80px;opacity:.72;animation:drift 15s ease-in-out infinite}
.b2{width:230px;height:230px;background:#8FB8FA;top:60px;right:-90px;opacity:.66;animation:drift 19s ease-in-out infinite reverse}
.b3{width:240px;height:240px;background:#F3B8E4;top:230px;left:-70px;opacity:.46;animation:drift 23s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-24px) scale(1.12)}66%{transform:translate(-18px,18px) scale(.92)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
@keyframes sheen{0%{left:-65%}58%,100%{left:135%}}
@keyframes sweep{0%{transform:translateX(-130%) skewX(-20deg)}55%,100%{transform:translateX(330%) skewX(-20deg)}}
@keyframes ring{0%{transform:scale(.8);opacity:.55}100%{transform:scale(2.1);opacity:0}}
h1{font-size:34px;letter-spacing:-1px;color:var(--ink);font-weight:800}
.tel{font-size:24px;font-weight:600;line-height:1.4;color:var(--primary);margin:2px 0 8px}
.hlogo{width:76px;height:64px;animation:bob 5.5s ease-in-out infinite;display:block;margin-bottom:8px}
.screen.on{animation:rise .5s cubic-bezier(.22,.9,.3,1)}
.card,details{background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #fff;box-shadow:0 10px 30px rgba(60,40,140,.10);border-radius:22px}
input,select,textarea{border-radius:14px;border:2px solid #DCD6F3;background:rgba(255,255,255,.92)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:0;box-shadow:0 0 0 4px rgba(124,58,237,.18)}
button{border-radius:28px;transition:transform .14s,box-shadow .14s,filter .14s}
button.main{position:relative;overflow:hidden;isolation:isolate;border:0;background:linear-gradient(95deg,var(--cta-from),var(--cta-to));box-shadow:0 8px 22px rgba(60,40,140,.26)}
button.main:hover{filter:brightness(1.06)}
button.main:active{transform:translateY(2px) scale(.985)}
button.main::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-65%;width:46%;pointer-events:none;transform:skewX(-18deg);background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.72) 50%,rgba(255,255,255,0));animation:sheen 6s cubic-bezier(.42,.02,.28,1) infinite}
button.main:disabled::after{animation:none;opacity:0}
.state{border-radius:22px;animation:pop .5s cubic-bezier(.2,1.2,.3,1);box-shadow:0 10px 30px rgba(60,40,140,.10)}
.s-ok .big{animation:pop .7s cubic-bezier(.2,1.4,.3,1) .1s both}
.s-listen .ico{position:relative;display:inline-block}
.s-listen .ico::before,.s-listen .ico::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--primary);animation:ring 2.2s ease-out infinite}
.s-listen .ico::after{animation-delay:1.1s}
nav{left:12px;right:12px;bottom:12px;max-width:416px;margin:0 auto;border:1px solid #fff;border-radius:28px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(60,40,140,.16)}
nav button{border-radius:22px}
.splash{position:fixed;inset:0;z-index:100;display:flex;justify-content:center;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 46%,#fff 72%),linear-gradient(170deg,#EDE8FC 0%,#E6EEFE 42%,#FBF8FF 78%);transition:opacity .34s}
.splash.leaving{opacity:0;pointer-events:none}
.glint{position:absolute;top:-12%;left:0;width:34%;height:124%;z-index:4;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.34) 42%,rgba(255,255,255,.94) 50.5%,rgba(255,255,255,.34) 59%,rgba(255,255,255,0));-webkit-mask-image:linear-gradient(180deg,#000 44%,rgba(0,0,0,.45) 60%,transparent 74%);mask-image:linear-gradient(180deg,#000 44%,rgba(0,0,0,.45) 60%,transparent 74%);animation:sweep 12s cubic-bezier(.42,.02,.28,1) infinite}
.sp{position:relative;z-index:1;width:100%;max-width:400px;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sp-top{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(48px,11vh,86px) 24px 0}
.logo{width:122px;height:102px;animation:bob 5.5s ease-in-out infinite}
.wm{font-size:46px;font-weight:800;letter-spacing:-1.4px;line-height:1;color:var(--ink);margin-top:24px}
.sp .tel{font-size:27px}
.tag{font-size:23px;font-weight:700;line-height:1.35;margin-top:32px}
.blurb{font-size:16.5px;line-height:1.55;color:var(--tx2);margin-top:12px;max-width:19em;text-wrap:balance}
.sp-foot{padding:24px 24px clamp(28px,5vh,44px)}
.sp-foot button{width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.fade{opacity:0;animation:rise .66s cubic-bezier(.22,.9,.3,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.3s}.d4{animation-delay:.42s}.d5{animation-delay:.56s}
@media(prefers-reduced-motion:reduce){.blob,.logo,.hlogo,.fade,.glint,button.main::after,.screen.on,.state,.s-ok .big,.s-listen .ico::before,.s-listen .ico::after{animation:none!important}.fade{opacity:1}.glint{display:none}}
:root{
  
  --primary:#6C3D95;
  --primary-light:#A78BFA;
  --accent:#3B82F6;
  --ink:#16215A;

  
  --bg:#F8FAFF;
  --surface:#FFFFFF;
  --line:#E6EBF5;

  
  --text:#1F2937;             
  --muted:#5A6B86;            

  
  --ok-fg:#087F5B;   --ok-bg:#E7F8F0;
  --warn-fg:#9A4A00; --warn-bg:#FFF2D9;
  --err-fg:#B42318;  --err-bg:#FEECEB;

  
  --cta-from:#2563EB;         
  --cta-to:#7C3AED;           

  
  --t-hosp-bg:#EFF4FF;  --t-hosp-fg:#2563EB;
  --t-train-bg:#EAFAF6; --t-train-fg:#0D7A66;
  --t-bus-bg:#FFF4E6;   --t-bus-fg:#9A4A00;
  --t-hist-bg:#FBF0F8;  --t-hist-fg:#6C3D95;

  
  --f-sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-telugu:"Noto Sans Telugu","Nirmala UI","Gautami",sans-serif;

  
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;

  
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:28px;

  
  --tap:56px;

  
  --navh:68px;
}
#home .topbar{
  display:flex;
  align-items:center;
  gap:var(--s3);
  margin-bottom:var(--s8);
}
#home .brand{
  font-size:26px;
  font-weight:800;
  letter-spacing:-.6px;
  color:var(--ink);
}
#home .brand .dot{color:var(--accent)}
#home .langchip{
  margin-left:auto;
  display:flex; align-items:center; gap:var(--s2);
  height:46px;
  padding:0 var(--s4);
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  background:var(--surface);
  color:var(--accent);
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(22,33,90,.06);
  transition:transform .14s ease;
}
#home .langchip:active{transform:scale(.97)}
#home .langchip:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
#home .greet{
  font-size:34px;
  line-height:1.25;
  font-weight:750;
  letter-spacing:-.6px;
  color:var(--ink);
}
#home .greet .wave{display:inline-block;transform-origin:70% 70%;animation:wave 6s ease-in-out infinite}
@keyframes wave{
  0%,88%,100%{transform:rotate(0deg)}
  91%{transform:rotate(16deg)}
  94%{transform:rotate(-8deg)}
  97%{transform:rotate(12deg)}
}
#home .greet-sub{
  margin-top:var(--s2);
  font-size:18px;
  color:var(--muted);
}
#home .hero{
  position:relative;
  overflow:hidden;
  isolation:isolate;            
  display:flex;
  align-items:center;
  gap:var(--s4);
  margin-top:var(--s6);
  padding:22px;
  border-radius:var(--r-xl);
  background:linear-gradient(100deg,var(--cta-from),var(--cta-to));
  color:#fff;
  text-decoration:none;
  box-shadow:0 12px 26px rgba(42,56,160,.28);
  transition:transform .14s ease, box-shadow .14s ease;
}
#home .hero:active{transform:translateY(2px) scale(.99);box-shadow:0 6px 14px rgba(42,56,160,.3)}
#home .hero:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
#home .hero-txt{position:relative;z-index:2;flex:1}
#home .hero-title{display:block;font-size:26px;font-weight:750;line-height:1.2;letter-spacing:-.3px}
#home .hero-sub{display:block;margin-top:6px;font-size:16px;font-weight:600;color:rgba(255,255,255,.92)}
#home .hero-go{
  position:relative;z-index:2;flex:none;
  width:44px;height:44px;
  display:grid;place-items:center;
  border-radius:50%;
  background:#fff;
  color:var(--cta-from);
}
#home .hero::after{
  content:"";
  position:absolute;
  top:-20%; bottom:-20%; left:-65%;
  width:46%;
  z-index:1;
  pointer-events:none;
  transform:skewX(-18deg);
  background:linear-gradient(100deg,
    rgba(255,255,255,0)    0%,
    rgba(255,255,255,.10) 30%,
    rgba(255,255,255,.72) 50%,
    rgba(255,255,255,.10) 70%,
    rgba(255,255,255,0)  100%);
  animation:sheenH 6s cubic-bezier(.42,.02,.28,1) infinite;
}
@keyframes sheenH{
  0%       {left:-65%}
  58%,100% {left:135%}
}
#home .section-h{
  margin:var(--s8) 0 var(--s4);
  font-size:24px;
  font-weight:750;
  letter-spacing:-.3px;
  color:var(--ink);
}
#home .tiles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--s3);
}
#home .tile{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:var(--s2);
  min-height:146px;
  padding:var(--s4) var(--s2);
  border:1px solid var(--line);
  border-radius:var(--r-xl);
  background:var(--surface);
  text-decoration:none;
  text-align:center;
  transition:transform .14s ease;
}
#home .tile:active{transform:scale(.97)}
#home .tile:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
#home .tile .ic{
  width:56px;height:56px;
  display:grid;place-items:center;
  border-radius:50%;
  margin-bottom:var(--s1);
}
#home .tile .name{font-size:19px;font-weight:700;color:var(--text);line-height:1.2}
#home .tile .hint{font-size:13px;color:var(--muted);line-height:1.3}
#home .tile.hosp{background:var(--t-hosp-bg)}
#home .tile.hosp  .ic{color:var(--t-hosp-fg); background:rgba(37,99,235,.12)}
#home .tile.train{background:var(--t-train-bg)}
#home .tile.train .ic{color:var(--t-train-fg);background:rgba(13,122,102,.12)}
#home .tile.bus{background:var(--t-bus-bg)}
#home .tile.bus   .ic{color:var(--t-bus-fg);  background:rgba(154,74,0,.12)}
#home .tile.hist{background:var(--t-hist-bg)}
#home .tile.hist  .ic{color:var(--t-hist-fg); background:rgba(108,61,149,.12)}
#home .help{
  display:flex;
  align-items:center;
  gap:var(--s3);
  margin-top:var(--s4);
  padding:var(--s3) var(--s4) var(--s3) var(--s3);
  border:1px solid var(--line);
  border-radius:var(--r-xl);
  background:var(--surface);
  text-decoration:none;
  transition:transform .14s ease;
}
#home .help:active{transform:scale(.985)}
#home .help:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
#home .help svg.person{flex:none;width:72px;height:60px;border-radius:var(--r-md)}
#home .help .txt{flex:1}
#home .help .t1{display:block;font-size:18px;font-weight:700;color:var(--ink);line-height:1.25}
#home .help .t2{display:block;font-size:15px;color:var(--muted);line-height:1.3}
#home .help .arr{flex:none;color:var(--accent)}
.scrim{
  position:fixed; inset:0;
  background:rgba(14,20,40,.46);
  opacity:0; pointer-events:none;
  transition:opacity .26s ease;
  z-index:30;
}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;
  bottom:0; left:50%;
  width:100%; max-width:400px;
  transform:translate(-50%,100%);
  transition:transform .3s cubic-bezier(.3,.9,.3,1);
  background:var(--surface);
  border-radius:24px 24px 0 0;
  padding:var(--s3) var(--s4) calc(env(safe-area-inset-bottom) + var(--s6));
  z-index:31;
  max-height:84dvh;
  overflow-y:auto;
  box-shadow:0 -10px 40px rgba(14,20,40,.22);
}
.sheet.open{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto var(--s4)}
.sheet h2{font-size:20px;font-weight:750;color:var(--ink);margin-bottom:var(--s3)}
.lang{
  display:flex;
  align-items:center;
  gap:var(--s3);
  width:100%;
  min-height:var(--tap);
  padding:0 var(--s3);
  border:0;
  border-radius:var(--r-md);
  background:transparent;
  color:var(--text);
  font-family:inherit;
  font-size:18px;
  text-align:left;
  cursor:pointer;
}
.lang:active{background:var(--t-hosp-bg)}
.lang:focus-visible{outline:3px solid var(--primary);outline-offset:-2px}
.lang .native{flex:1;font-weight:650}
.lang .en{font-size:14px;color:var(--muted);font-weight:500}
.lang .tick{opacity:0;color:var(--accent);flex:none}
.lang[aria-checked="true"] .tick{opacity:1}
.lang[aria-checked="true"]{background:var(--t-hosp-bg)}
.lang[lang="te"] .native,.lang[lang="hi"] .native,.lang[lang="ta"] .native,.lang[lang="kn"] .native,.lang[lang="ml"] .native,.lang[lang="mr"] .native,.lang[lang="pa"] .native,.lang[lang="bn"] .native,.lang[lang="gu"] .native{
  font-family:var(--f-telugu),var(--f-sans);
  line-height:1.4;              
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-height:700px){#home .greet{font-size:29px}
#home .tile{min-height:130px}
#home .tile .ic{width:48px;height:48px}
#home .section-h{margin-top:var(--s6)}}
#home .langchip{min-height:46px}
#home .tile.off{opacity:.6;cursor:default}
#home .howtxt{margin-top:var(--s3);padding:var(--s4);border-radius:var(--r-lg);background:var(--t-hosp-bg);color:var(--text);font-size:17px}
html:not([lang=en]) body{font-family:"Noto Sans Telugu","Nirmala UI","Mangal","Noto Sans","Segoe UI",system-ui,sans-serif;line-height:1.6}
.state p,.hint{line-height:1.6}
.wrap{padding-bottom:112px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 124 104"><path d="M40 34A26 26 0 0 0 40 74" stroke="#22C1EE" stroke-width="7.5" fill="none" stroke-linecap="round"/><path d="M28 24A40 40 0 0 0 28 84" stroke="#3B82F6" stroke-width="7.5" fill="none" stroke-linecap="round"/><path d="M84 34A26 26 0 0 1 84 74" stroke="#A855F7" stroke-width="7.5" fill="none" stroke-linecap="round"/><path d="M96 24A40 40 0 0 1 96 84" stroke="#D946EF" stroke-width="7.5" fill="none" stroke-linecap="round"/><circle cx="62" cy="28" r="12.5" fill="#2563EB"/><circle cx="62" cy="25" r="4.6" fill="#fff"/><path d="M47 50Q47 44 53 44L71 44Q77 44 77 50L77 82Q77 88 71 88L53 88Q47 88 47 82Z" fill="#2563EB"/></symbol></svg>
<div class="aurora" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
<main class="splash" id="splash">
  <span class="blob b1" aria-hidden="true"></span><span class="blob b2" aria-hidden="true"></span><span class="blob b3" aria-hidden="true"></span>
  <span class="glint" aria-hidden="true"></span>
  <div class="sp">

how|సేవ ప్రకటనలు వింటుంది, మీ టోకెన్ నంబర్‌ను గుర్తించి, మీరు ఏ గదికి వెళ్ళాలో చెబుతుంది. “వినడం మొదలుపెట్టు” నొక్కి, మీ టోకెన్ నమోదు చేసి, ఫోన్‌ను మీ దగ్గర ఉంచండి.|Seva listens to announcements, finds your token number, and tells you which room to go to. Tap “Start Listening”, enter your token, and keep the phone with you.|सेवा घोषणाएँ सुनती है, आपका टोकन नंबर पहचानती है और बताती है कि किस कमरे में जाना है। “सुनना शुरू करें” दबाएँ, अपना टोकन डालें और फ़ोन अपने पास रखें।|சேவா அறிவிப்புகளைக் கேட்டு, உங்கள் டோக்கன் எண்ணைக் கண்டறிந்து, எந்த அறைக்குச் செல்ல வேண்டும் என்று சொல்கிறது. “கேட்கத் தொடங்கு” என்பதை அழுத்தி, உங்கள் டோக்கனை உள்ளிட்டு, போனை உங்களிடம் வைத்திருங்கள்.|ಸೇವಾ ಪ್ರಕಟಣೆಗಳನ್ನು ಆಲಿಸಿ, ನಿಮ್ಮ ಟೋಕನ್ ಸಂಖ್ಯೆಯನ್ನು ಗುರುತಿಸಿ, ಯಾವ ಕೊಠಡಿಗೆ ಹೋಗಬೇಕೆಂದು ಹೇಳುತ್ತದೆ. “ಆಲಿಸಲು ಪ್ರಾರಂಭಿಸಿ” ಒತ್ತಿ, ನಿಮ್ಮ ಟೋಕನ್ ನಮೂದಿಸಿ, ಫೋನ್ ನಿಮ್ಮ ಬಳಿ ಇಟ್ಟುಕೊಳ್ಳಿ.|സേവ അറിയിപ്പുകൾ കേട്ട്, നിങ്ങളുടെ ടോക്കൺ നമ്പർ കണ്ടെത്തി, ഏത് മുറിയിലേക്ക് പോകണമെന്ന് പറയുന്നു. “കേൾക്കാൻ തുടങ്ങുക” അമർത്തി, നിങ്ങളുടെ ടോക്കൺ നൽകി, ഫോൺ കൂടെ വയ്ക്കുക.|सेवा घोषणा ऐकते, तुमचा टोकन क्रमांक ओळखते आणि कोणत्या खोलीत जायचे ते सांगते. “ऐकणे सुरू करा” दाबा, तुमचा टोकन टाका आणि फोन जवळ ठेवा.|ਸੇਵਾ ਘੋਸ਼ਣਾਵਾਂ ਸੁਣਦੀ ਹੈ, ਤੁਹਾਡਾ ਟੋਕਨ ਨੰਬਰ ਲੱਭਦੀ ਹੈ ਅਤੇ ਦੱਸਦੀ ਹੈ ਕਿ ਕਿਹੜੇ ਕਮਰੇ ਵਿੱਚ ਜਾਣਾ ਹੈ। “ਸੁਣਨਾ ਸ਼ੁਰੂ ਕਰੋ” ਦਬਾਓ, ਆਪਣਾ ਟੋਕਨ ਦਰਜ ਕਰੋ ਅਤੇ ਫ਼ੋਨ ਆਪਣੇ ਕੋਲ ਰੱਖੋ।|সেবা ঘোষণা শোনে, আপনার টোকেন নম্বর খুঁজে বের করে এবং কোন কক্ষে যেতে হবে তা জানায়। “শোনা শুরু করুন” চাপুন, আপনার টোকেন লিখুন এবং ফোন কাছে রাখুন।|સેવા જાહેરાતો સાંભળે છે, તમારો ટોકન નંબર શોધે છે અને કયા રૂમમાં જવાનું છે તે જણાવે છે. “સાંભળવાનું શરૂ કરો” દબાવો, તમારો ટોકન દાખલ કરો અને ફોન પાસે રાખો.

/* ---- talking to the backend ---- */
async function postJSON(path,body,signal){
  const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal});
  let data=null;try{data=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error('http '+r.status),{status:r.status,data});
  return data;
}
function errMsg(e){return e&&e.name==='TypeError'?T('s0'):T('errM')}
/* Numbers are shown only if the backend returned them in exactly this shape. */
function validDetect(d){
  return !!d&&typeof d==='object'
    &&(d.token===null||(typeof d.token==='string'&&/^[A-Z]-\d{1,3}$/.test(d.token)))
    &&(d.room===null||(typeof d.room==='string'&&/^\d{1,4}$/.test(d.room)))
    &&(d.match===null||d.match==='yours'||d.match==='other');
}
/* audio -> /listen (transcript) -> /detect (token, room, yours/other) */
async function hear(blob,name,lang,mine){
  const fd=new FormData();fd.append('audio',blob,name);fd.append('language_code',lang);
  const r=await fetch(API+'/listen',{method:'POST',body:fd});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error('listen '+r.status),{status:r.status,data:j});
  if(!j||typeof j.transcript!=='string')throw new Error('bad reply');
  if(!j.transcript.trim())return{d:{token:null,room:null,match:null},transcript:''};
  const d=await postJSON('/detect',{transcript:j.transcript,my_token:mine});
  if(!validDetect(d))throw new Error('bad reply');
  return{d,transcript:j.transcript};
}

/* ---- voice: Gnani first, browser voice as a fallback ---- */
function note(out,m){const n=el('p','hint',m);out.appendChild(n);setTimeout(()=>n.remove(),6000)}
function browserSpeak(text,lang,out){
  if(!('speechSynthesis' in window))return note(out,T('noVoice'));
  const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith(lang));
  if(!v)return note(out,T('noVoice'));
  const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;speechSynthesis.cancel();speechSynthesis.speak(u);
}
const audioCache=new Map();
async function playVoice(text,code,out){
  const key=code+'|'+text;
  try{
    let url=audioCache.get(key);
    if(!url){
      const r=await fetch(API+'/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language:code})});
      if(!r.ok)throw new Error('tts '+r.status);
      url=URL.createObjectURL(await r.blob());
      if(audioCache.size>=10){const k=audioCache.keys().next().value;URL.revokeObjectURL(audioCache.get(k));audioCache.delete(k)}
      audioCache.set(key,url);
    }
    await new Audio(url).play();
  }catch(e){
    if(e&&e.name==='NotAllowedError')return;
    browserSpeak(text,code.slice(0,2),out);
  }
}

/* ---- audio helpers: microphone -> 16 kHz mono WAV ---- */
function rms(f){let s=0;for(let i=0;i<f.length;i++)s+=f[i]*f[i];return Math.sqrt(s/Math.max(1,f.length))}
function resample(f,from,to){
  if(from===to)return f;
  const ratio=from/to,n=Math.floor(f.length/ratio),out=new Float32Array(n);
  for(let i=0;i<n;i++){
    const s=Math.floor(i*ratio),e=Math.max(s+1,Math.min(Math.floor((i+1)*ratio),f.length));
    let sum=0;for(let j=s;j<e;j++)sum+=f[j];out[i]=sum/(e-s);
  }
  return out;
}
function encodeWav(f,sr){
  const buf=new ArrayBuffer(44+f.length*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+f.length*2,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,f.length*2,true);
  for(let i=0;i<f.length;i++){const x=Math.max(-1,Math.min(1,f[i]));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7FFF,true)}
  return new Blob([buf],{type:'audio/wav'});
}

/* ---- Listen: live microphone ---- */
const WINDOW_S=10,EVERY_S=5,QUIET=0.004;
let live=null;
async function startListening(){
  go('listen');
  const mine=$('token').value.trim();
  if(!TOKEN_OK.test(mine))return needToken();
  if(live)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    return micBlocked(T('micM')+' (https)');
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){
    const n=e&&e.name;
    return (n==='NotAllowedError'||n==='SecurityError')?micBlocked():showErr(T('noMic'));
  }
  const Ctx=window.AudioContext||window.webkitAudioContext;
  const ctx=new Ctx();
  if(ctx.state==='suspended')await ctx.resume();
  const src=ctx.createMediaStreamSource(stream);
  const node=ctx.createScriptProcessor(4096,1,1);
  const mute=ctx.createGain();mute.gain.value=0;
  const L={stream,ctx,src,node,mute,chunks:[],total:0,busy:false,fails:0,timer:null,wake:null,mine,lang:$('lang').value};
  node.onaudioprocess=e=>{
    const d=new Float32Array(e.inputBuffer.getChannelData(0));
    L.chunks.push(d);L.total+=d.length;
    const bar=$('meterBar');if(bar)bar.style.width=Math.min(100,Math.round(rms(d)*500))+'%';
    const max=ctx.sampleRate*WINDOW_S;
    while(L.chunks.length>1&&L.total-L.chunks[0].length>=max)L.total-=L.chunks.shift().length;
  };
  src.connect(node);node.connect(mute);mute.connect(ctx.destination);
  L.timer=setInterval(()=>tick(L),EVERY_S*1000);
  live=L;
  try{if(navigator.wakeLock)L.wake=await navigator.wakeLock.request('screen')}catch(e){}
  listening();
}
function stopLive(){
  const L=live;live=null;controls(false);
  if(!L)return;
  clearInterval(L.timer);
  try{L.node.onaudioprocess=null;L.src.disconnect();L.node.disconnect();L.mute.disconnect()}catch(e){}
  try{L.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{L.ctx.close()}catch(e){}
  try{if(L.wake)L.wake.release()}catch(e){}
}
async function tick(L){
  if(live!==L||L.busy)return;
  const sr=L.ctx.sampleRate;
  const need=Math.min(L.total,Math.floor(sr*WINDOW_S));
  if(need<sr*2)return;
  const all=new Float32Array(L.total);let o=0;
  for(const c of L.chunks){all.set(c,o);o+=c.length}
  const win=all.subarray(all.length-need);
  if(rms(win)<QUIET){setHeard(T('quiet'));return}  /* silence: nothing is sent */
  L.busy=true;
  setHeard(T('chk'));
  try{
    const h=await hear(encodeWav(resample(win,sr,16000),16000),'clip.wav',L.lang,L.mine);
    if(live!==L)return;
    L.fails=0;
    dbgShow(h.transcript);
    onHeard(h.d,L,h.transcript);
  }catch(e){
    if(live!==L)return;
    L.fails++;
    const auth=e&&e.data&&e.data.error==='auth';
    if(L.fails>=2||auth){const m=errMsg(e);stopLive();showErr(m)}
  }finally{L.busy=false}
}
/* While listening, only YOUR token changes the screen. */
function onHeard(d,L,transcript){
  if(d.token===null)return setHeard(transcript&&transcript.trim()?T('noTok'):T('noSp'));
  if(d.match==='yours')return d.room?confirmed(d,L.lang):missing(true);
  setHeard(T('oth2'));
}

function askDone(){clearInterval(tick2);askCtl=null;$('askBtn').disabled=false}
$('askBtn').addEventListener('click',async()=>{
  const q=$('q').value.trim(),lang=tagOf();
  if(!q)return askState('s-warn','warn',T('typeQ'),[{t:T('typeM')}]);
  $('askBtn').disabled=true;let sec=0;

    if(d.fallback&&lang!=='en')sc.appendChild(el('p','hint',T('fb')));
  }catch(e){
    if(e&&e.name==='AbortError'&&!timedOut)askState('s-idle',null,T('canc'),[{t:T('cancM')}]);
    else if(e&&e.name==='AbortError')askState('s-err','err',T('slow'),[{t:T('slowM')}],[{t:T('tryA'),main:true,fn:()=>$('askBtn').click()}]);
    else askState('s-err','err',T('noAns'),[{t:errMsg(e)}],[{t:T('tryA'),main:true,fn:()=>$('askBtn').click()}]);
  }finally{clearTimeout(timeout);askDone()}
});

/* ---- server check on the home screen ---- */
function paintStatus(){$('status').textContent=srvOk===null?'':(srvOk?T('s1'):T('s0'))}
async function checkSrv(){try{const r=await fetch(API+'/health');const j=await r.json();srvOk=!!(j&&j.status==='ok')}catch(e){srvOk=false}paintStatus()}

/* ---- apply the chosen language to every screen ---- */
function applyStatic(){
  document.documentElement.lang=tagOf();
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=T(e.dataset.i18n)});
  document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=T(e.dataset.ph)});
  const h=new Date().getHours();$('greetWord').textContent=T(h<12?'g1':(h<17?'g2':'g3'));
  $('langName').textContent=langObj().native;$('sheetTitle').textContent=T('sel');$('howTxt').textContent=T('how');
  document.querySelectorAll('#langList .lang').forEach(b=>b.setAttribute('aria-checked',b.dataset.code===APP?'true':'false'));
  paintStatus();
}
function setLang(code){
  if(!LANGS.some(l=>l.code===code))return;
  APP=code;try{localStorage.setItem('seva.language',code)}catch(e){}
  if(!live)$('lang').value=code;          /* the announcement language follows the app language until you change it */
  applyStatic();
  if(live)listening();else idle();         /* re-draw the visible card in the new language */
  A.replaceChildren();
}
/* language sheet */
(function(){
  const list=$('langList'),sheet=$('sheet'),scrim=$('scrim'),btn=$('langBtn'),ls=$('lang');
  LANGS.forEach(L=>{
    const o=document.createElement('option');o.value=L.code;o.textContent=L.native;ls.appendChild(o);
    const b=document.createElement('button');b.type='button';b.className='lang';b.setAttribute('role','radio');b.setAttribute('lang',L.tag);b.dataset.code=L.code;
    const n=el('span','native',L.native),e=el('span','en',L.en),t=el('span','tick');t.appendChild($('tickTpl').content.cloneNode(true));
    b.append(n,e,t);b.addEventListener('click',()=>{setLang(L.code);close()});list.appendChild(b);
  });
  function open(){sheet.hidden=false;requestAnimationFrame(()=>sheet.classList.add('open'));scrim.classList.add('open');btn.setAttribute('aria-expanded','true');document.body.style.overflow='hidden'}
  function close(){sheet.classList.remove('open');setTimeout(()=>{if(!sheet.classList.contains('open'))sheet.hidden=true},300);scrim.classList.remove('open');btn.setAttribute('aria-expanded','false');document.body.style.overflow=''}
  btn.addEventListener('click',()=>sheet.classList.contains('open')?close():open());
  scrim.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
document.querySelectorAll('a.off').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
$('howBtn').addEventListener('click',e=>{e.preventDefault();const t=$('howTxt');t.hidden=!t.hidden});
$('lang').value=APP;
applyStatic();idle();checkSrv();
</script>
<script>
/* Splash: shown on the first visit only. Open with ?splash to see it again. */
(function(){
  const sp=$('splash');let seen=false;
  try{seen=localStorage.getItem('seva.seenSplash')==='1'}catch(e){}
  if(seen&&!/[?&]splash(=|&|$)/.test(location.search)){sp.remove();return}
  $('getStarted').addEventListener('click',()=>{
    try{localStorage.setItem('seva.seenSplash','1')}catch(e){}
    sp.classList.add('leaving');setTimeout(()=>sp.remove(),340);
  });
})();
</script>
